
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acadêmico DevOps</title>
    <link rel="stylesheet" href="style.css">

    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="topo">
        <h1>Portal Acadêmico DevOps</h1>

        <nav class="navegacao">
            <a href="#servicos">Serviços</a>
        </nav>

        <button id="botaoDestaque">Ver serviços</button>
    </header>

    <main>
        <section id="servicos" class="secao">
            <h2>Serviços disponíveis</h2>

            <div class="cards">

                
                <article class="card">
                    <i class="fa-solid fa-file-signature icone-servico"></i>
                    <h3>Matrícula</h3>
                    <p>Orientações sobre matrícula e documentação.</p>
                </article>

                
                <article class="card">
                    <i class="fa-solid fa-calendar-days icone-servico"></i>
                    <h3>Calendário</h3>
                    <p>Datas importantes do período letivo.</p>
                </article>

                
                <article class="card">
                    <i class="fa-solid fa-headset icone-servico"></i>
                    <h3>Atendimento</h3>
                    <p>Canal para dúvidas e solicitações.</p>
                </article>

            </div>
        </section>

        <section class="secao">
            <h2>Contato</h2>

            <form id="formContato">
                <label for="nome">Nome</label>
                <input id="nome" type="text" placeholder="Digite seu nome">

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem"
                    placeholder="Digite sua solicitação"></textarea>

                <button type="submit">Enviar</button>
            </form>

            <p id="resposta"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
